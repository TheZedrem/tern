# Tern settings. Every key is optional: the values below are the
# defaults, and a key you delete keeps its default. Changes apply when you
# save, without a restart. A mistake never stops Tern from starting:
# the broken part falls back to its default and a notice says why.

# The profile new tabs open. Missing: shell, your login shell.
# default_profile: shell

# Profiles: what a pane runs. The key is the profile's ID. A `shell`
# profile, your login shell, is always there; define one called `shell`
# here to change it.
# profiles:
#   shell:
#     type: local
#     env: { EDITOR: nvim }       # set on top of the usual environment
#   htop:
#     name: Htop                  # shown in the tab; defaults to the ID
#     type: local
#     command: [htop]             # program and arguments
#     cwd: ~/projects             # default: your home directory
#     theme: light                # just for this profile's panes

font:
  family: null      # an installed font's exact name; null = the bundled Lilex
  size: 13
  line_height: 1.2  # a multiple of the font size

scrollback: 10000   # lines each pane keeps
close_on_exit: clean  # always | clean (exit code 0) | never
copy_on_select: false # copy a selection as soon as it's made
restore_session: true # reopen the last run's tabs and splits
open_new_tab: true    # every launch opens a fresh tab after the restored ones, or focuses a restored plain local shell
open_links: ctrl_click # ctrl_click (Cmd+click on macOS) | click
tab_bar: top          # top | bottom | left | right (left and right: vertical tabs)
app_sidebar: right    # left | right: where the sidebar opens (Ctrl+Shift+S)
sftp_click: edit      # what double-clicking a remote file does: edit (in your app) | download
sftp_upload: manual   # when an edit's saves go back: manual (Upload button) | save | focus
files_executable: ask # what double-clicking a local program in the files pane (Ctrl+Shift+B) does: ask | run | edit
new_tab: ask          # what Ctrl+Shift+T does: ask (which profile) | default;
                      # Ctrl+Alt+Shift+T does the other

# Look for a new Tern release on GitHub once a day: daily | off. Checking
# sends your IP address to GitHub. Until you choose, Tern asks you once
# after it starts.
# update_check: daily

cursor:
  style: block      # block | beam | underline; programs may change it
  blink: true

# How the focused pane stands out in a tab with splits.
active_pane:
  border: 2         # its border in pixels, 0-6; 0 = none
  color: null       # the border's color like "#ff8800"; null = the theme's accent
  dim: 30           # how much the other panes are dimmed, 0-50 percent; 0 = not at all

# Your own keys for commands, by ID: the command palette (Ctrl+Shift+P)
# shows the ID of the command you highlight. A command you bind here loses
# its default key, which then goes to the shell, and a default key you give
# another command leaves its old command without one.
# keybindings:
#   "alt+shift+d": pane.splitRight
#   "ctrl+shift+n": tab.new

theme:
  default: dark     # dark | light | system | a theme name
  # Your own themes. A theme can also be a file, themes/<name>.yaml next to
  # this one, with the same keys. Colors you leave out come from `base`.
  # custom:
  #   midnight:
  #     base: dark
  #     background: "#1e1e2e"   # quote colors: an unquoted # starts a comment
  #     foreground: "#cdd6f4"
  #     cursor: "#f5c2e7"
  #     # Also: selection, accent, and the 16 terminal colors black, red,
  #     # green, yellow, blue, magenta, cyan, white, bright_black, ...,
  #     # bright_white.

# Plugins: programs in the plugins folder (~/.local/share/tern/plugins/<id>/,
# on Windows %LOCALAPPDATA%\tern\plugins\<id>\) that add commands and panels.
# A plugin runs as you and can do what you can: enable only one from a
# source you trust. One whose plugin.yaml names another command line than
# `run` here isn't started.
# plugins:
#   docker:
#     enabled: true
#     run: [./tern-docker]                # the command line you agreed to
#     rights: [pane_info, terminal_write] # of pane_info, terminal_write, terminal_read, open_tab
#     events: [pane_opened, pane_closed]  # of start, pane_opened, pane_closed
#     settings: { socket: /var/run/docker.sock } # plain text: no place for secrets
