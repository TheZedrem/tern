# Release packages: a `v*` tag builds the .deb, .rpm and AppImage (T-026)
# and the Windows MSI (spec 0012) and attaches them to a GitHub release,
# after the CI checks (ci.yml) pass on Linux and Windows. The Linux ones
# are built on ubuntu-24.04, so they need glibc 2.39 or newer.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  linux:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Install Rust and the packaging tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig-dev
          cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
          curl -sSfLo appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c
          chmod +x appimagetool

      - run: cargo build --locked --release
      - run: cargo deb --no-build
      - run: cargo generate-rpm
      # The runner has no FUSE, so appimagetool runs extracted.
      - run: APPIMAGE_EXTRACT_AND_RUN=1 packaging/linux/appimage.sh ./appimagetool

      - name: Attach the packages to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            target/debian/*.deb target/generate-rpm/*.rpm target/packages/*.AppImage

  # Windows MSI (spec 0012). `linux` creates the release and this job only
  # adds to it, so they can't race. A failure leaves the release without an
  # MSI; re-running this job adds it.
  windows:
    needs: [checks, linux]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust and WiX
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          dotnet tool install --global wix --version 7.0.1
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - run: cargo build --locked --release
      # -acceptEula: the project accepts WiX v7's EULA (OQ-024).
      - run: wix build -arch x64 -acceptEula wix7 packaging/windows/tern.wxs -o "target/packages/tern-$($env:GITHUB_REF_NAME.TrimStart('v'))-x64.msi"

      - name: Attach the MSI to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME (Get-Item target/packages/*.msi)
