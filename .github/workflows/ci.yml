# CI (T-007, OQ-004): format, lint, test and release-build on Linux and
# Windows, plus the MSI on Windows. TTFP isn't gated here, since shared
# runners are too noisy; the bench stays local (spec 0001). Only GitHub's
# own actions are used, pinned to commit SHAs. Runs on every push to main
# and every pull request. A push to main keeps the release binary and the
# MSI as artifacts, which release.yml packages when that commit is tagged,
# so a release builds nothing twice.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      # The build links libxkbcommon and needs fontconfig's pkg-config file
      # (docs/development.md).
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig-dev

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release

      # Builds the MSI from that exe, so a broken tern.wxs fails here and
      # not first on a release tag (spec 0012). The EULA: OQ-024.
      - name: Build the MSI
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 7.0.1
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" build -arch x64 -acceptEula wix7 packaging/windows/tern.wxs -o target/packages/tern-x64.msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # What release.yml packages. Only pushes to main are released, so
      # pull requests keep nothing. A week is enough to tag a pushed commit;
      # after that, re-running this workflow for it brings them back.
      - name: Keep the release binary
        if: github.event_name == 'push' && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tern-linux
          path: target/release/tern
          retention-days: 7
          if-no-files-found: error
      - name: Keep the MSI
        if: github.event_name == 'push' && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tern-windows
          path: target/packages/tern-x64.msi
          retention-days: 7
          if-no-files-found: error
