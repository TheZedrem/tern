[package]
name = "zed-term"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "zed_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
portable-pty = "0.9"
dirs = "7"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
