[package]
name = "tern"
version = "0.4.0"
edition = "2024"
publish = false
description = "A fast terminal with built-in SSH and SFTP"
license = "EUPL-1.2"
authors = ["Andreas Zeidler"]

[dependencies]
# GPUI and its widgets are pinned exactly and bumped together, in their own
# commit with a TTFP measurement (spec/architecture.md §Key decisions).
gpui = { package = "gpui-pre", version = "=0.3.11" }
# Wayland only. Without this feature GPUI builds fine and runs headless.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["wayland"] }
gpui-component = "=0.9.0"
gpui-kit-assets = "=0.9.0"
alacritty_terminal = "0.26"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
dirs = "7"
# Config hot reload (spec 0005). gpui-component already depends on it.
notify = "8.2"
# ssh's prompts answered in the app, and the passwords it remembers (spec
# 0006, threat model 0001).
keyring = "4.2"
interprocess = "2.4"
getrandom = "0.4"
zeroize = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# The SFTP sidebar's client, over `ssh -s <host> sftp` (spec 0008). Its
# thread runs a current-thread tokio runtime; GPUI already builds tokio.
russh-sftp = "3"
tokio = { version = "1", features = ["rt", "process", "io-util", "sync", "time", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Without font-kit, GPUI's macOS backend renders no text at all.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit"] }

[features]
# Compile GPUI's Metal shaders at launch instead of at build time, for Macs
# without Xcode's `metal` compiler. Costs startup time on every launch;
# packaging/macos/install.sh turns it on only when `metal` is missing.
runtime-shaders = ["gpui_platform/runtime_shaders"]

[target.'cfg(windows)'.dependencies]
# What interprocess takes the askpass pipe's security descriptor as.
widestring = "1"
# AttachConsole, so CLI output reaches the terminal of a GUI-subsystem tern.exe;
# PeekNamedPipe, to wait on askpass helpers without a read.
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Pipes"] }

[target.'cfg(windows)'.build-dependencies]
# build.rs embeds the icon and version info in tern.exe (spec 0012).
winresource = { version = "0.1.34", default-features = false }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

# Linux packages (T-026): `cargo deb` and `cargo generate-rpm` after a
# release build, into target/debian and target/generate-rpm. The Wayland
# client and the Vulkan loader are loaded at runtime, so they're listed by
# hand; a Vulkan driver comes with every desktop install.
[package.metadata.deb]
maintainer = "Andreas Zeidler"
section = "utils"
extended-description = "Tern starts to a prompt in under half a second and keeps SSH hosts, stored passwords and SFTP one click away. Needs a Wayland session."
depends = "libc6 (>= 2.39), libxkbcommon0, libwayland-client0, libvulkan1"
recommends = "openssh-client"
license-file = ["LICENSE", "0"]
assets = [
    ["target/release/tern", "usr/bin/", "755"],
    ["packaging/linux/de.zedrem.tern.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/512x512/apps/de.zedrem.tern.png", "644"],
    ["assets/fonts/lilex/OFL.txt", "usr/share/doc/tern/Lilex-OFL.txt", "644"],
]

# Fedora and openSUSE name these packages differently, so the runtime
# libraries are required by soname; linked ones are found automatically.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/tern", dest = "/usr/bin/tern", mode = "755" },
    { source = "packaging/linux/de.zedrem.tern.desktop", dest = "/usr/share/applications/de.zedrem.tern.desktop", mode = "644" },
    { source = "assets/icon.png", dest = "/usr/share/icons/hicolor/512x512/apps/de.zedrem.tern.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/tern/LICENSE", mode = "644", doc = true },
    { source = "assets/fonts/lilex/OFL.txt", dest = "/usr/share/licenses/tern/Lilex-OFL.txt", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
"libwayland-client.so.0()(64bit)" = "*"
"libvulkan.so.1()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
openssh-clients = "*"
