[package]
name = "zed-term"
version = "0.1.0"
edition = "2024"
publish = false

# The UI stack (eframe/egui, alacritty_terminal) lands with T-010; see
# spec/architecture.md §Stack.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
dirs = "7"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
